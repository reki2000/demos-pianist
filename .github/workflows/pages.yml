name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify
        run: |
          node repertoire-test.cjs > docs/verification/repertoire/music.json
          node piano-hand-test.cjs > piano-hand-verification.json
          node camera-gestures-test.cjs > docs/verification/mobile-camera/gestures.json
          node cinematic-camera-test.cjs > docs/verification/cinematic/camera.json
          node verify.cjs > verification.json
          node audio-test.cjs > audio-verification.json
          node string-audio-test.cjs > string-audio-verification.json
          node geometry-test.cjs > geometry-verification.json
          node guitar-fingering-hand-test.cjs > docs/verification/guitar-finger-clearance/fingering.json
          node guitar-finger-clearance-test.cjs > docs/verification/guitar-finger-clearance/clearance.json
          node guitar-hand-test.cjs > docs/verification/guitar-hands/verification.json
          node guitar-geometry-test.cjs > docs/verification/guitar-hands/geometry.json
          node guitar-skin-test.cjs > docs/verification/guitar-hands/skin.json
          node guitar-continuity-test.cjs > docs/verification/guitar-hands/continuity.json
          node bow-hold-test.cjs > bow-hold-verification.json
          node bow-skin-test.cjs > bow-skin-verification.json
          node hand-surface-test.cjs > hand-surface-verification.json
          node violin-skin-test.cjs > violin-skin-verification.json
          node violin-left-hand-test.cjs > violin-left-hand-verification.json
          node score-test.cjs > score-verification.json
          node pedal-test.cjs > pedal-verification.json
      - name: Build standalone HTML and zip
        run: python pack-v8.py
      - name: Assemble site
        run: |
          mkdir _site
          cp -r dist/. _site/
          cp piano-recital.html piano-recital.zip THIRD-PARTY-NOTICES.md _site/
          cp -r audio-licenses _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
