name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify
        run: |
          node verify.cjs > verification.json
          node audio-test.cjs > audio-verification.json
      - name: Build standalone HTML and zip
        run: python pack-v8.py
      - name: Assemble site
        run: |
          mkdir _site
          cp -r dist/. _site/
          cp piano-recital.html piano-recital.zip THIRD-PARTY-NOTICES.md _site/
          cp -r audio-licenses _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
